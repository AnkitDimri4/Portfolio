  <!-- Self-hosted fonts (SIL OFL), no third-party requests. The first screen uses all four (the hero's
       heading and its serif word, the text, the mono labels), so all four are asked for at once rather
       than after the CSS: the first paint comes about 0.2 s sooner on a throttled phone. -->
  <link rel="preload" href="/fonts/bricolage-grotesque-opsz96.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/geist-mono.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/instrument-serif-italic.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family: "Bricolage Grotesque"; src: url("/fonts/bricolage-grotesque-opsz96.woff2") format("woff2"); font-weight: 500 800; font-display: swap; }
    @font-face { font-family: "Geist"; src: url("/fonts/geist.woff2") format("woff2"); font-weight: 400 600; font-display: swap; }
    @font-face { font-family: "Geist Mono"; src: url("/fonts/geist-mono.woff2") format("woff2"); font-weight: 400 500; font-display: swap; }
    @font-face { font-family: "Instrument Serif"; src: url("/fonts/instrument-serif-italic.woff2") format("woff2"); font-style: italic; font-weight: 400; font-display: swap; }
  </style>

  <!-- Apply the saved theme before first paint (no flash) -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") {
        document.documentElement.setAttribute("data-theme", t);
        document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "light" ? "#f3f0e8" : "#0a0a0c");
      }
    } catch (e) {}
  </script>

  <!-- Without JavaScript, show the content that otherwise fades in on scroll -->
